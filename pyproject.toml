[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartcity-trafficmonitor"
version = "0.1.0"
description = "Smart city traffic monitoring at BME - ingestion, CV detection, analytics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "numpy>=1.24",
    "opencv-python>=4.8,<5",
    "lap>=0.5.12",
    "ultralytics>=8.4.0",
    "yt-dlp[default]>=2025.11.12",
]

[tool.setuptools]
packages = ["common", "data", "dashboard", "cv"]
