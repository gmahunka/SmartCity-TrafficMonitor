[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartcity-trafficmonitor"
version = "0.1.0"
description = "Smart city traffic monitoring at BME - ingestion, CV detection, analytics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi", "uvicorn"]

[tool.setuptools]
packages = ["common", "data"]
